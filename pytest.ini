# Repo-wide pytest config. This repo is one directory per tool (see the
# sibling tool directories), each with its own tests/, so there is no single
# package root to hang a config off of -- this file has to live here, at the
# repo root, because pytest only discovers one ini file by walking up from the
# invocation directory, and every tool's README says to run pytest from here.
# asyncio_mode = auto is needed by endor_linear_bridge's `async def test_*`
# functions (and any other tool that adopts async tests); without it every
# such test is silently skipped rather than run, which is worse than an error.
[pytest]
asyncio_mode = auto
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient
